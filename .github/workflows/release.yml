name: Create a release

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10

# GitHub occasionally delivers the same tag push more than once. Serialize
# release runs per ref and cancel duplicates so a version can never be
# published twice.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pages: write

jobs:
  build:
    name: Create a release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"
      - id: versions
        name: Read canonical toolchain versions
        run: |
          . ./.env
          echo "emsdk=$EMSDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "node=$NODE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Cache C++ archives
        id: cache-archives
        uses: actions/cache@v4
        with:
          path: build/lib
          key: ${{ runner.os }}-emsdk-${{ steps.versions.outputs.emsdk }}-archives-${{ hashFiles('HiGHS/**/*.cmake', 'HiGHS/**/CMakeLists.txt', 'HiGHS/highs/**/*.cpp', 'HiGHS/highs/**/*.h', 'build.sh') }}
          restore-keys: |
            ${{ runner.os }}-emsdk-${{ steps.versions.outputs.emsdk }}-archives-
      - uses: mymindstorm/setup-emsdk@v16
        with: { version: "${{ steps.versions.outputs.emsdk }}" }
      - uses: actions/setup-node@v6
        with:
          node-version: "${{ steps.versions.outputs.node }}"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - name: verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - name: verify generated C API inventory
        run: npm run check:api
      - name: build
        env:
          HIGHS_SKIP_MAKE: ${{ steps.cache-archives.outputs.cache-hit == 'true' && '1' || '0' }}
        run: npm run build
      - name: test
        run: npm test
      - name: verify packed package
        run: npm run test:package
      - run: npm run build:demo
      - name: generate options reference
        run: npm run docs:options
      - name: publish the package to NPM
        run: |-
          VER=$(node -p 'require("./package.json").version')
          if npm view "highs@$VER" version >/dev/null 2>&1; then
            echo "highs@$VER is already published on npm; skipping."
            exit 0
          fi
          TAG=$(echo "$VER" | grep -q -- '-' && echo next || echo latest)
          npm publish --provenance --tag "$TAG"
      - name: advance the next dist-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |-
          VER=$(node -p 'require("./package.json").version')
          case "$VER" in
            *-*)
              echo "Prerelease: npm publish already tagged it as next."
              ;;
            *)
              npm dist-tag add "highs@$VER" next \
                || echo "::warning::Could not advance the next dist-tag to $VER"
              ;;
          esac
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/highs.wasm
            build/highs.js
            build/highs.mjs
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
      - name: Deploy demo and documentation
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: demo
